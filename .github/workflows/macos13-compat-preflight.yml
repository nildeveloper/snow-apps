name: macOS 13 Compatibility Preflight

on:
  push:
    branches:
      - feature/macos13-compat
      - "fix/macos13-*"
  pull_request:
    branches:
      - feature/macos13-compat
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos13-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Build script regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check compatibility source boundaries
        run: python3 scripts/test-macos13-source-compat.py -v
      - name: Check compilation cache transport
        run: python3 scripts/test-macos13-compile-cache.py -v
      - name: Check idempotent Metal compatibility preparation
        run: python3 scripts/test-prepare-macos13-metal.py -v
      - name: Check macOS compatibility policy
        run: >-
          python3 scripts/test-macos-build-support.py QtMacOSDeploymentPolicy
          MacOSBuildScripts.test_ci_cached_build_reuses_only_compiler_outputs_and_packages_once -v

  jthread:
    name: Native compatibility preflight ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
          - name: Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check export construction and macOS 13 screen adapter
        run: python3 scripts/test-macos13-source-compat.py -v

      - name: Prepare pinned jthread headers
        shell: bash
        run: |
          set -euo pipefail
          include_dir="${RUNNER_TEMP}/jthread/include"
          mkdir -p "${include_dir}"
          base="https://raw.githubusercontent.com/josuttis/jthread/3e1908f3bbaba6d2195bb423840c23e107c9e8b2/source"
          curl -fsSL "${base}/jthread.hpp" -o "${include_dir}/jthread.hpp"
          curl -fsSL "${base}/stop_token.hpp" -o "${include_dir}/stop_token.hpp"
          echo "SNOW_PREFLIGHT_JTHREAD_INCLUDE=${include_dir}" >> "${GITHUB_ENV}"

      - name: Compile macOS 13 jthread compatibility probe
        shell: bash
        run: |
          set -euo pipefail

          src="${RUNNER_TEMP}/jthread-probe"
          build="${RUNNER_TEMP}/jthread-probe-build"
          mkdir -p "${src}"

          cat > "${src}/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.25)
          project(snow_jthread_preflight LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(SNOW_JTHREAD_BACKPORT_INCLUDE_DIR "$ENV{SNOW_PREFLIGHT_JTHREAD_INCLUDE}" CACHE PATH "" FORCE)
          list(APPEND CMAKE_MODULE_PATH "$ENV{GITHUB_WORKSPACE}/cmake")
          include(SnowMacOSCxx20Compat)
          snow_configure_macos_cxx20_compat()
          add_executable(jthread_probe main.cpp)
          add_executable(stop_wait_tests "$ENV{GITHUB_WORKSPACE}/test-support/macos-build/stop_wait_tests.cpp")
          target_include_directories(stop_wait_tests PRIVATE "$ENV{GITHUB_WORKSPACE}/snow_image/include")
          enable_testing()
          add_test(NAME stop-wait-compatibility COMMAND stop_wait_tests)
          set_tests_properties(stop-wait-compatibility PROPERTIES TIMEOUT 15)
          CMAKE

          cat > "${src}/main.cpp" <<'CPP'
          #include <stop_token>
          #include <thread>

          int main() {
              std::stop_source source;
              bool observed = false;
              std::jthread worker([&](std::stop_token token) {
                  observed = token.stop_possible();
              });
              source.request_stop();
              worker.join();
              return observed ? 0 : 1;
          }
          CPP

          cmake -S "${src}" -B "${build}"             -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0             -DCMAKE_CXX_COMPILER="$(xcrun --find clang++)"
          cmake --build "${build}" --parallel 2
          "${build}/jthread_probe"
          ctest --test-dir "${build}" -R '^stop-wait-compatibility$' --output-on-failure
